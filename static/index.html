<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suporte BimBam Buy</title>
<style>
  :root {
    --bg: #f4f1fb;
    --panel: #ffffff;
    --accent: #7c3aed;
    --accent-2: #f97316;
    --text: #1f1330;
    --muted: #6b6478;
    --bubble-user: #7c3aed;
    --bubble-bot: #f1edfb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg), #ffffff);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
    background: var(--panel);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(124, 58, 237, 0.12);
    overflow: hidden;
  }
  header {
    padding: 20px 24px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: white;
  }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; font-size: 0.95rem; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.bot.loading { color: var(--muted); font-style: italic; }
  .sources { align-self: flex-start; font-size: 0.72rem; color: var(--muted); margin-top: -6px; padding-left: 4px; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid #eee;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 999px;
    padding: 0 22px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Suporte BimBam Buy</h1>
      <p>Tire suas dúvidas sobre pedidos, reembolsos, envio e mais</p>
    </header>
    <div class="messages" id="messages">
      <div class="msg bot">Oi! Eu sou o assistente da BimBam Buy 👋 Como posso te ajudar hoje?</div>
    </div>
    <form id="form">
      <input type="text" id="input" placeholder="Digite sua dúvida..." autocomplete="off" maxlength="2000" />
      <button type="submit" id="send">Enviar</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  let history = [];

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addSources(sources) {
    if (!sources || sources.length === 0) return;
    const div = document.createElement("div");
    div.className = "sources";
    div.textContent = "Fontes: " + sources.join(", ");
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendEl.disabled = true;

    const loadingEl = addMessage("Digitando...", "bot");
    loadingEl.classList.add("loading");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });
      if (!res.ok) throw new Error("Falha na resposta do servidor");
      const data = await res.json();

      loadingEl.remove();
      addMessage(data.response, "bot");
      addSources(data.sources);

      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: data.response });
      history = history.slice(-6);
    } catch (err) {
      loadingEl.remove();
      addMessage("Ops, algo deu errado. Tente novamente em instantes.", "bot");
    } finally {
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
